# Paste this at https://api.slack.com/apps → Create New App → From a manifest.
# It pre-configures Socket Mode, the /adops slash command, interactivity, and
# the bot scopes the ad-factory bot needs.
display_information:
  name: Ad Factory
  description: Daily ad automation — run status, pause/kill, angle stats
  background_color: "#14603f"
features:
  bot_user:
    display_name: adfactory
    always_online: true
  slash_commands:
    - command: /adops
      description: Control the ad factory (status, pause, kill, run, perf, angles)
      usage_hint: "status | pause | resume | kill | skip | run | perf | angles | health"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - files:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
